x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD-SHELL", "pg_isready -U postgres"]
  interval: 5s
  timeout: 3s
  retries: 5
  start_period: 5s

services:
  # ---------------------------------------------------------------
  # Shared infrastructure
  # ---------------------------------------------------------------
  db:
    image: postgres:16
    container_name: db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck: *postgres-healthcheck

  trading-db:
    image: postgres:16
    container_name: trading-db
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=tradingdb
    volumes:
      - trading-pg-data:/var/lib/postgresql/data
    healthcheck: *postgres-healthcheck

  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --smp
      - "1"
      - --memory
      - 1G
      - --mode
      - dev-container
      - --overprovisioned
    ports:
      - "19092:19092"
      - "18082:18082"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redpanda-console:
    image: redpandadata/console:latest
    container_name: redpanda-console
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - KAFKA_BROKERS=redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy

  # ---------------------------------------------------------------
  # bet-service
  # ---------------------------------------------------------------
  openapi-generator-bet-server:
    image: openapitools/openapi-generator-cli:latest
    volumes:
      - .:/app
    working_dir: /app
    command: >
      sh -lc "
      openapi-generator-cli generate
      -i bet-service/openapi.yaml
      -g scala-http4s-server
      -o bet-service/generated/server
      --additional-properties=packageName=bet_service.generated.server,packageVersion=1.0.0,excludeSbt=true
      && sh bet-service/scripts/fix-generated-server-models.sh
      && rm -f bet-service/generated/server/build.sbt
      "

  openapi-generator-bet-client:
    image: openapitools/openapi-generator-cli:latest
    volumes:
      - .:/app
    working_dir: /app
    command: >
      sh -lc "
      openapi-generator-cli generate
      -i bet-service/openapi.yaml
      -g scala-sttp
      -o bet-service/generated/client
      --additional-properties=packageName=bet_service.generated.client,packageVersion=1.0.0
      && rm -f bet-service/generated/client/build.sbt
      "

  bet-service:
    build:
      context: .
      dockerfile: bet-service/Dockerfile
    container_name: bet-service
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - BET_SERVICE_DB_URL=jdbc:postgresql://db:5432/postgres
      - BET_SERVICE_DB_USER=postgres
      - BET_SERVICE_DB_PASSWORD=postgres
      - KAFKA_BROKERS=redpanda:9092
    depends_on:
      db:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  # ---------------------------------------------------------------
  # trading-service
  # ---------------------------------------------------------------
  openapi-generator-trading-server:
    image: openapitools/openapi-generator-cli:latest
    volumes:
      - .:/app
    working_dir: /app
    command: >
      sh -lc "
      openapi-generator-cli generate
      -i trading-service/openapi.yaml
      -g scala-http4s-server
      -o trading-service/generated/server
      --additional-properties=packageName=trading_service.generated.server,packageVersion=1.0.0,excludeSbt=true
      && rm -f trading-service/generated/server/build.sbt
      "

  openapi-generator-trading-client:
    image: openapitools/openapi-generator-cli:latest
    volumes:
      - .:/app
    working_dir: /app
    command: >
      sh -lc "
      openapi-generator-cli generate
      -i trading-service/openapi.yaml
      -g scala-sttp
      -o trading-service/generated/client
      --additional-properties=packageName=trading_service.generated.client,packageVersion=1.0.0
      && rm -f trading-service/generated/client/build.sbt
      "

  trading-service:
    build:
      context: .
      dockerfile: trading-service/Dockerfile
    container_name: trading-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - TRADING_SERVICE_DB_URL=jdbc:postgresql://trading-db:5432/tradingdb
      - TRADING_SERVICE_DB_USER=postgres
      - TRADING_SERVICE_DB_PASSWORD=postgres
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_GROUP_ID=trading-service-group
      - KAFKA_TOPIC=bets.placed
    depends_on:
      trading-db:
        condition: service_healthy
      redpanda:
        condition: service_healthy

volumes:
  pg-data:
  redpanda-data:
  trading-pg-data: