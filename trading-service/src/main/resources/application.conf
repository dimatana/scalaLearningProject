http-port      = 3001
http-port      = ${?TRADING_SERVICE_HTTP_PORT}

db-url         = ${?TRADING_SERVICE_DB_URL}

db-user        = ${?TRADING_SERVICE_DB_USER}

db-password    = ${?TRADING_SERVICE_DB_PASSWORD}

http-shutdown-timeout = 10 seconds

db-max-pool-size = 10
db-max-pool-size = ${?TRADING_SERVICE_DB_MAX_POOL_SIZE}

