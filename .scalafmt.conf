version = "3.8.4"
runner.dialect = scala3

maxColumn = 120

align.preset = more
align.multiline = false

indent.defnSite   = 2
indent.extendSite = 2

newlines.source = keep
newlines.topLevelStatementBlankLines = [
  { blanks { before = 1 } }
]
project.excludeFilters = [
  "bet-service/generated/",
  "trading-service/generated/"
]

rewrite.rules = [RedundantBraces]