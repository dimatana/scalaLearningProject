http-port      = 3000
http-port      = ${?BET_SERVICE_HTTP_PORT}

db-url         = "jdbc:postgresql://localhost:5433/postgres"
db-url         = ${?BET_SERVICE_DB_URL}

db-user        = "postgres"
db-user        = ${?BET_SERVICE_DB_USER}

db-password    = "postgres"
db-password    = ${?BET_SERVICE_DB_PASSWORD}

kafka-brokers  = "localhost:19092"
kafka-brokers  = ${?KAFKA_BROKERS}

bet-placed-topic = "bets.placed"
bet-placed-topic = ${?BET_PLACED_TOPIC}

http-shutdown-timeout = 10 seconds

db-max-pool-size = 10
db-max-pool-size = ${?BET_SERVICE_DB_MAX_POOL_SIZE}

db-min-idle       = 2
db-min-idle       = ${?BET_SERVICE_DB_MIN_IDLE}

db-connection-timeout = 5 seconds